media:
  input: public
  output: /

content:
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    view:
      fields: [title, years, strand, featured]
      sort: [sortYear, title]
      default:
        sort: sortYear
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: years
        label: Years (display)
        description: 'As shown on the card, e.g. "2011" or "2016–ongoing"'
        type: string
        required: true
      - name: sortYear
        label: Start year (for ordering)
        type: number
        required: true
      - name: strand
        label: Strand
        type: select
        required: true
        options:
          values: [Strategy, Creative, Research]
      - name: summary
        label: Summary (back of card)
        description: Aim for ~40 words — longer text scrolls inside the card.
        type: text
        required: true
      - name: partner
        label: Partner / client line
        type: string
      - name: award
        label: Award (shown as badge on card)
        type: string
      - name: image
        label: Card image
        type: image
      - name: imageAlt
        label: Image alt text
        type: string
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: href
            label: URL
            type: string
            required: true
      - name: featured
        label: Featured (big 2×2 tile)
        type: boolean
      - name: draft
        label: Draft (hide from site)
        type: boolean
      - name: body
        label: Notes (not shown on site yet)
        type: rich-text

  - name: publications
    label: Research
    type: collection
    path: src/content/publications
    view:
      fields: [title, year, type, venue, featured]
      sort: [year, title]
      default:
        sort: year
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: year
        label: Year (for ordering)
        type: number
        required: true
      - name: yearLabel
        label: Year label (override)
        description: 'Only if the displayed year differs, e.g. "In progress" or "c2011"'
        type: string
      - name: type
        label: Type
        type: select
        required: true
        options:
          values: [Monograph, Book, Journal Papers, Book Chapters, Essay, Report, Working Paper, White Paper, PhD thesis, Conferences, Dataset, Creative Research, Commissioned Research Contracts, Commissioned Strategy & Advisory]
      - name: venue
        label: Venue
        description: Journal, publisher, or outlet
        type: string
        required: true
      - name: authors
        label: Authors
        description: Leave blank if sole-authored
        type: string
      - name: href
        label: Link (publisher / landing page)
        type: string
      - name: doi
        label: DOI
        description: 'Bare DOI, no https — e.g. 10.1177/00420980211014026'
        type: string
      - name: citations
        label: Citation count
        type: number
      - name: note
        label: Note (one line of context)
        type: text
      - name: isbn
        label: ISBN (books and chapters)
        type: string
      - name: areas
        label: Content areas
        description: Arts, Technology, Place, History — pick any that apply
        type: select
        list: true
        options:
          multiple: true
          values: [Arts, Technology, Place, History]
      - name: openAccess
        label: Open access copy
        description: Repository URL, Zenodo link, or a PDF on this site — shows a "free to read" chip
        type: string
      - name: featured
        label: Featured (also list on About page)
        type: boolean
      - name: draft
        label: Draft (hide from site)
        type: boolean
      - name: body
        label: Abstract / notes (not shown on site yet)
        type: rich-text

  - name: blog
    label: Writing
    type: collection
    path: src/content/blog
    view:
      fields: [title, pubDate, category, draft]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: pubDate
        label: Publication date
        type: date
        required: true
      - name: updatedDate
        label: Updated date
        type: date
      - name: category
        label: Category (format — e.g. Paper, Workshop, Essay, Note)
        type: string
      - name: topic
        label: Topic (subject, shown next to the date)
        type: string
      - name: draft
        label: Draft
        type: boolean
      - name: resources
        label: Resources (foot of post)
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: href
            label: URL
            type: string
            required: true
          - name: type
            label: Type tag (e.g. PDF, LINK)
            type: string
      - name: body
        label: Body
        type: rich-text
